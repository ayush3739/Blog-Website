{% include "header.html" %}

<!-- Error Page Header -->
<header class="masthead" style="background-image: url('{{ url_for('static', filename='assets/img/home-bg.jpg') }}')">
  <div class="container position-relative px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">
        <div class="site-heading">
          <h1>404</h1>
          <span class="subheading">Page Not Found</span>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Error Content -->
<div class="container px-4 px-lg-5">
  <div class="row gx-4 gx-lg-5 justify-content-center">
    <div class="col-md-10 col-lg-8 col-xl-7 text-center py-5">
      <div class="error-content">
        <div class="error-icon mb-4">
          <i class="fas fa-ghost" style="font-size: 5rem; color: #0085A1;"></i>
        </div>
        <h2 class="mb-3">Oops! Page not found</h2>
        <p class="text-muted mb-4">
          The page you're looking for doesn't exist or has been moved.<br>
          Don't worry, even the best explorers get lost sometimes.
        </p>
        <div class="error-actions">
          <a href="{{ url_for('get_all_posts') }}" class="btn btn-primary btn-lg me-2">
            <i class="fas fa-home me-2"></i>Go Home
          </a>
          <a href="{{ url_for('contact') }}" class="btn btn-outline-secondary btn-lg">
            <i class="fas fa-envelope me-2"></i>Contact Us
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

{% include "footer.html" %}
