{% include "header.html" %}

<!-- Error Page Header -->
<header class="masthead" style="background-image: url('{{ url_for('static', filename='assets/img/home-bg.jpg') }}')">
  <div class="container position-relative px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">
        <div class="site-heading">
          <h1>500</h1>
          <span class="subheading">Server Error</span>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Error Content -->
<div class="container px-4 px-lg-5">
  <div class="row gx-4 gx-lg-5 justify-content-center">
    <div class="col-md-10 col-lg-8 col-xl-7 text-center py-5">
      <div class="error-content">
        <div class="error-icon mb-4">
          <i class="fas fa-exclamation-triangle" style="font-size: 5rem; color: #dc3545;"></i>
        </div>
        <h2 class="mb-3">Something went wrong</h2>
        <p class="text-muted mb-4">
          We're experiencing some technical difficulties.<br>
          Our team has been notified and is working on it.
        </p>
        <div class="error-actions">
          <a href="{{ url_for('get_all_posts') }}" class="btn btn-primary btn-lg me-2">
            <i class="fas fa-home me-2"></i>Go Home
          </a>
          <button onclick="location.reload()" class="btn btn-outline-secondary btn-lg">
            <i class="fas fa-redo me-2"></i>Try Again
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

{% include "footer.html" %}
