{% include "header.html" %}

<!-- Page Header-->
<header
  class="masthead"
  style="background-image: url('../static/assets/img/home-bg.jpg')"
>
  <div class="container position-relative px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">
        <div class="site-heading">
          <h1>BlogPy</h1>
          <span class="subheading">Thoughts on tech, learning, and growth.
</span>
        </div>
      </div>
    </div>
  </div>
</header>
<!-- Main Content-->
<div class="container px-4 px-lg-5">
  <div class="row gx-4 gx-lg-5 justify-content-center">
    <div class="col-md-10 col-lg-8 col-xl-7">
      <div id="posts-container">
        {% include "_posts.html" %}
      </div>
    </div>
  </div>
</div>

<script>
  // Intercept pagination link clicks inside the posts container
  document.addEventListener('click', function (e) {
    const link = e.target.closest('#posts-container a.page-link');
    if (!link) return;
    e.preventDefault();

    fetch(link.href, {
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
      .then(function (res) { return res.text(); })
      .then(function (html) {
        document.getElementById('posts-container').innerHTML = html;
        window.history.pushState({}, '', link.href);
        document.getElementById('posts-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
  });
</script>
