<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BlogPy - Developer Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-dim": "#c8ea69",
              "surface": "#ffffff",
              "surface-bright": "#f8f9fa",
              "primary-container": "#FFD98C",
              "background": "#f8f9fa",
              "inverse-surface": "#0c0e10",
              "on-secondary": "#525151",
              "on-error-container": "#ffd2c8",
              "surface-variant": "#e9ecef",
              "surface-tint": "#F5A500",
              "secondary": "#495057",
              "surface-dim": "#f1f3f5",
              "on-primary-fixed-variant": "#473000",
              "on-surface": "#1a1c1e",
              "error": "#d53d18",
              "primary-fixed-dim": "#F5A500",
              "on-tertiary": "#506700",
              "surface-container-lowest": "#ffffff",
              "surface-container-high": "#e9ecef",
              "error-dim": "#d53d18",
              "secondary-container": "#dee2e6",
              "on-surface-variant": "#495057",
              "on-secondary-fixed": "#403f3f",
              "surface-container-low": "#f1f3f5",
              "primary-dim": "#F5A500",
              "tertiary-fixed": "#d5f976",
              "outline-variant": "#dee2e6",
              "inverse-on-surface": "#f6f6f8",
              "secondary-dim": "#d6d4d3",
              "on-background": "#1a1c1e",
              "tertiary-container": "#d5f976",
              "on-secondary-container": "#d2d0cf",
              "on-primary-fixed": "#2B1D00",
              "outline": "#adb5bd",
              "primary": "#F5A500",
              "secondary-fixed": "#e5e2e1",
              "on-primary-container": "#2B1D00",
              "on-tertiary-container": "#495e00",
              "secondary-fixed-dim": "#d6d4d3",
              "primary-fixed": "#F5A500",
              "on-secondary-fixed-variant": "#5c5b5b",
              "on-primary": "#ffffff",
              "tertiary": "#f3ffcc",
              "error-container": "#b92902",
              "tertiary-fixed-dim": "#c8ea69",
              "on-error": "#ffffff",
              "on-tertiary-fixed-variant": "#516900",
              "on-tertiary-fixed": "#394b00",
              "surface-container": "#f8f9fa"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .kinetic-input-focus:focus-within {
        border-left: 2px solid #F5A500;
      }
      .bg-glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
      }
    </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col">
<nav class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-xl border-b border-black/5">
<div class="flex justify-between items-center px-8 py-6 max-w-7xl mx-auto w-full">
<div class="flex items-center gap-8">
<a class="text-2xl font-black text-black tracking-tighter font-headline" href="#">Blog<span class="text-[#F5A500]">Py</span></a>
<div class="hidden md:flex gap-6 items-center">
<a class="font-manrope tracking-tight font-bold text-on-surface hover:text-primary transition-colors" href="#">Articles</a>
<a class="font-manrope tracking-tight font-bold text-on-surface-variant hover:text-on-surface transition-colors" href="#">Archives</a>
<a class="font-manrope tracking-tight font-bold text-on-surface-variant hover:text-on-surface transition-colors" href="#">Architects</a>
<a class="font-manrope tracking-tight font-bold text-on-surface-variant hover:text-on-surface transition-colors" href="#">Series</a>
</div>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant hover:text-on-surface cursor-pointer transition-all" data-icon="dark_mode">dark_mode</span>
<span class="material-symbols-outlined text-on-surface-variant hover:text-on-surface cursor-pointer transition-all" data-icon="search">search</span>
<button class="px-5 py-2 text-sm font-bold text-on-surface-variant hover:text-on-surface transition-all duration-300">Login</button>
<button class="hover:bg-black hover:text-white text-on-primary-fixed px-6 py-2 font-bold scale-95 active:scale-100 transition-all bg-primary">Register</button>
</div>
</div>
</nav>
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-primary/5 rounded-full blur-[100px]"></div>
</div>
<main class="flex-grow flex items-center justify-center p-6 relative z-10 pt-32">
<div class="w-full max-w-[440px]">
<div class="bg-surface-container-lowest shadow-[0_32px_64px_-16px_rgba(0,0,0,0.06)] p-10 md:p-12 border border-outline-variant/30">
<header class="mb-10">
<h2 class="font-headline text-2xl font-bold text-on-surface tracking-tight">Access Terminal</h2>
<p class="text-on-surface-variant mt-2 text-sm leading-relaxed">Enter your credentials to manage your architectural series.</p>
</header>
<form class="space-y-8">
<div class="space-y-1 group">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant font-bold block mb-2" for="email">
                            Identity / Email
                        </label>
<div class="relative kinetic-input-focus transition-all duration-300">
<input class="w-full bg-surface-container-low border-none rounded-none py-4 px-4 text-on-surface placeholder:text-outline focus:ring-0 text-sm transition-all" id="email" placeholder="architect@blogpy.dev" type="email"/>
</div>
</div>
<div class="space-y-1 group">
<div class="flex justify-between items-end mb-2">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant font-bold" for="password">
                                Security / Password
                            </label>
<a class="text-[10px] uppercase tracking-widest text-primary font-bold hover:opacity-80 transition-opacity" href="#">
                                Forgot Password?
                            </a>
</div>
<div class="relative kinetic-input-focus transition-all duration-300">
<input class="w-full bg-surface-container-low border-none rounded-none py-4 px-4 text-on-surface placeholder:text-outline focus:ring-0 text-sm transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-4">
<button class="w-full text-on-primary-fixed font-headline font-bold py-4 uppercase tracking-widest text-xs hover:shadow-lg hover:shadow-primary/20 hover:translate-y-[-2px] transition-all duration-300 bg-primary" type="submit">
                            Initialize Session
                        </button>
</div>
</form>
<div class="mt-10 pt-8 border-t border-outline-variant text-center">
<p class="text-xs text-on-surface-variant font-medium">
                        New Architect? 
                        <a class="text-primary font-bold ml-1 uppercase tracking-tighter hover:underline" href="#">
                            Create Account
                        </a>
</p>
</div>
</div>
<div class="mt-8 flex justify-center items-center gap-8">
<div class="flex items-center gap-2 grayscale opacity-60 hover:opacity-100 hover:grayscale-0 transition-all cursor-pointer text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="terminal">terminal</span>
<span class="text-[10px] font-label uppercase tracking-widest">SSH Access</span>
</div>
<div class="flex items-center gap-2 grayscale opacity-60 hover:opacity-100 hover:grayscale-0 transition-all cursor-pointer text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="key">key</span>
<span class="text-[10px] font-label uppercase tracking-widest">OAuth 2.0</span>
</div>
</div>
</div>
</main>
<footer class="bg-white py-12 px-8 mt-auto border-t border-black/5">
<div class="flex flex-col md:flex-row justify-between items-center w-full gap-6 max-w-7xl mx-auto">
<div class="text-on-surface-variant font-bold text-sm tracking-widest uppercase">
                © 2024 BlogPy / System Nominal
            </div>
<div class="flex gap-8">
<a class="text-on-surface-variant transition-colors font-['Inter'] text-sm uppercase tracking-widest hover:text-primary" href="#">Twitter</a>
<a class="text-on-surface-variant transition-colors font-['Inter'] text-sm uppercase tracking-widest hover:text-primary" href="#">Github</a>
<a class="text-on-surface-variant transition-colors font-['Inter'] text-sm uppercase tracking-widest hover:text-primary" href="#">LinkedIn</a>
<a class="text-on-surface-variant transition-colors font-['Inter'] text-sm uppercase tracking-widest hover:text-primary" href="#">RSS</a>
</div>
</div>
</footer>
</body></html>
